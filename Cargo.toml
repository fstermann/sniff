[package]
name = "sniff-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Find ambiguous, contradictory, and unverifiable writing"
license = "MIT"
repository = "https://github.com/fstermann/sniff"
readme = "README.md"
exclude = ["research/**", "src/**", "tests/__pycache__/**"]

[[bin]]
name = "sniff"
path = "rust/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
globset = "0.4"
ignore = "0.4"
include_dir = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
strip = true

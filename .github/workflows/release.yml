name: Release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
      version:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        type: string
        required: true
      version:
        description: Release version without the v prefix
        type: string
        required: true

permissions:
  contents: write

env:
  VALE_VERSION: "3.17.0"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  package-unix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            vale: Linux_64-bit.tar.gz
          - runner: macos-13
            target: x86_64-apple-darwin
            platform: macos-x86_64
            vale: macOS_64-bit.tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
            vale: macOS_arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.platform }}" "${{ matrix.vale }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: sniff-*.tar.gz

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-release.ps1 x86_64-pc-windows-msvc windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: sniff-*.zip

  publish:
    needs: [package-unix, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/sniff-*
          generate_release_notes: true

[project]
site_name = "sniff"
site_url = "https://fstermann.github.io/sniff/"
site_description = "Find ambiguous, contradictory, and unverifiable writing."
repo_url = "https://github.com/fstermann/sniff"
repo_name = "fstermann/sniff"
edit_uri = "edit/main/docs/"
nav = [
  { "Overview" = "index.md" },
  { "Install and use" = "usage.md" },
  { "LLM workflow" = "llm-workflow.md" },
  { "Rule explorer" = "rules.md" },
  { "Configuration" = "configuration.md" },
]
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["generated/rules.js", "javascripts/rule-explorer.js"]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "lime"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
